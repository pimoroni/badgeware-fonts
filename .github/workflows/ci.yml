name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.9.2"
  BLACK_VERSION: "26.5.1"

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --all-extras

      - name: Format
        run: uvx black@${{ env.BLACK_VERSION }} --check --diff .

      - name: Lint
        run: uv run ruff check --config ci/ruff.toml src tests

      - name: Cache source fonts
        uses: actions/cache@v6
        with:
          path: build/sources
          key: sources-${{ hashFiles('fonts.toml', 'corpus/*.txt') }}
          restore-keys: sources-

      - run: uv run pytest tests -q

  build:
    name: Build the fonts
    runs-on: ubuntu-latest
    needs: [check]

    permissions:
      contents: write

    outputs:
      families: ${{ steps.families.outputs.names }}

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --all-extras

      - name: Cache source fonts
        uses: actions/cache@v6
        with:
          path: build/sources
          key: sources-${{ hashFiles('fonts.toml', 'corpus/*.txt') }}
          restore-keys: sources-

      - name: Build
        run: uv run badgeware-fonts build --out out

      - name: Read every font back out of the bundle
        run: |
          unzip -q out/badgeware-fonts.zip -d fonts
          uv run badgeware-fonts inspect fonts/*.af

      - name: Stage the assets
        run: |
          mv fonts/index.json out/index.json
          rm out/badgeware-fonts.zip

      - name: List the families
        id: families
        run: |
          names=$(cd out && ls *.zip | jq -Rsc 'split("\n") | map(select(length > 0)) | map(rtrimstr(".zip"))')
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "$names"

      - name: Upload the index
        uses: actions/upload-artifact@v7
        with:
          name: index.json
          path: out/index.json

      - name: Pass the zips to the artefact jobs
        uses: actions/upload-artifact@v7
        with:
          name: all-zips
          path: out/*.zip
          compression-level: 0
          retention-days: 1

      - name: Attach to the release
        if: startsWith(github.event.release.tag_name, 'fonts-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            out/*.zip
            out/index.json

  artefacts:
    name: ${{ matrix.family }}
    runs-on: ubuntu-latest
    needs: [build]

    strategy:
      matrix:
        family: ${{ fromJSON(needs.build.outputs.families) }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: all-zips

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.family }}
          path: ${{ matrix.family }}.zip
          compression-level: 0
