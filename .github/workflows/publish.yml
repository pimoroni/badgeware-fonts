name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.9.2"

jobs:
  dist:
    name: Build the distribution
    if: >
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Build the sdist and the wheel
        run: uv build

      - name: Check the built version is the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          BUILT="$(ls dist/*.whl | head -1 | cut -d- -f2)"
          echo "tag=$TAG built=$BUILT"
          if [ "$GITHUB_REF_NAME" != "$TAG" ] && [ "$TAG" != "$BUILT" ]; then
            echo "::error::built $BUILT from tag $TAG - check whether the checkout could"
            echo "::error::see the tag at all"
            exit 1
          fi

      - name: Run the CLI out of the wheel
        run: uv run --no-project --with dist/*.whl badgeware-fonts --manifest fonts.toml list

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [dist]

    environment:
      name: pypi
      url: https://pypi.org/p/badgeware-fonts

    permissions:
      id-token: write

    steps:
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        run: uv publish --trusted-publishing always
