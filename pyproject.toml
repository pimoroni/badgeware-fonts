[project]
name = "badgeware-fonts"
dynamic = ["version"]
description = "Build alright-fonts (.af) files for Badgeware, from a manifest"
readme = "README.md"
authors = [
    { name = "Philip Howard", email = "phil@pimoroni.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "freetype-py>=2.4",
    "shapely>=2.1",
]

[project.optional-dependencies]
web = ["fonttools[woff]>=4.50"]

[project.scripts]
badgeware-fonts = "badgeware_fonts.cli:main"

[project.urls]
Homepage = "https://github.com/pimoroni/badgeware-fonts"
Repository = "https://github.com/pimoroni/badgeware-fonts"
Issues = "https://github.com/pimoroni/badgeware-fonts/issues"

# The tag is the version.
[tool.hatch.version]
source = "uv-dynamic-versioning"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/badgeware_fonts"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.black]
line-length = 200
target-version = ["py311"]
